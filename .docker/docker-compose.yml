version: "3.8"

services:
  web:
    image: litespeedtech/openlitespeed:latest # Verify PHP 8.2 post-setup
    container_name: mc-wp-litespeed
    ports:
      - "8080:80"     # WordPress
      - "7080:7080"   # LiteSpeed Admin
    environment:
      LSADMIN_USER: mc-admin
      LSADMIN_PASS: 12f69QPtxir9Wt3
      WORDPRESS_DB_HOST: localhost
      WORDPRESS_DB_USER: mc-dev
      WORDPRESS_DB_PASSWORD: 5mCNe3gAtP_t6YDple
      WORDPRESS_DB_NAME: mappingcrimes
    volumes:
      - ./wordpress:/var/www/html    # Mount entire WordPress directory
      - ./wp-content:/var/www/html/wp-content  # Optional: separate content mount
      - ./config/php:/usr/local/lsws/lsphp74/etc  # Custom PHP config (if needed)
    command: >
      bash -c "apt-get update && apt-get install -y php8.2-gd php8.2-curl php8.2-xml php8.2-mbstring && /usr/local/lsws/bin/lswsctrl start"
    depends_on:
      - db

  db:
    image: mysql:8.0    # Updated to MySQL 8 for compatibility
    container_name: mc-db
    environment:
      MYSQL_ROOT_PASSWORD: ozH0o31q5TW0
      MYSQL_DATABASE: mappingcrimes-db
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: