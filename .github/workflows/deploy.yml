name: Sync to beta VPS

on:
  push:
    branches: [ main, dev/backend-bootstrap]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/mc-dev
          chmod 600 ~/.ssh/mc-dev
          ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts

      - name: Rsync wp-content to beta
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_DEST: ${{ secrets.SSH_DEST }}  # Make sure this secret exists
        run: |
          rsync -avz --delete \
            wp-content/ \
            $SSH_USER@$SSH_HOST:$SSH_DEST/wp-content/

      - name: Purge LiteSpeed cache
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          ssh $SSH_USER@$SSH_HOST \
            "curl -s -X PURGE https://mc-beta.yourVPS.com/wp-content/cache/* || true"
